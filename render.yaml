services:
  - type: web
    name: assistente-pessoal-ia
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_CITY
        value: "Itobi, SP"
      - key: DEFAULT_LAT
        value: "-21.7336"
      - key: DEFAULT_LON
        value: "-46.9744"
